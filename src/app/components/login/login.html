<div class="login-wrapper">
  <div class="login-container">
    <div class="login-header">
      <h1 class="brand-title">GOBELET RESERVÉ<span class="brand-sub">.bo</span></h1>
      <p class="login-subtitle">Acceso exclusivo para administración</p>
    </div>

    <form class="login-form" (ngSubmit)="ingresar()">
      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="admin@gobeletreserve.bo" 
          required
        >
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="••••••••" 
          required
        >
      </div>

      <div class="error-message" *ngIf="mensajeError">
        {{ mensajeError }}
      </div>

      <button type="submit" class="btn-login" [disabled]="cargando">
        {{ cargando ? 'Verificando...' : 'Acceder al Panel' }}
      </button>
    </form>
  </div>
</div>
